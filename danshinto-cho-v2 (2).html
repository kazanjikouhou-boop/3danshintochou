<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#223A5E">
<title>檀信徒帳</title>
<style>
:root{
  --paper:#F6F3EC;
  --card:#FCFBF7;
  --sumi:#2B2A26;
  --kon:#223A5E;
  --kon-deep:#18293F;
  --shu:#B23A2F;
  --matcha:#5E7350;
  --nezu:#8A8577;
  --line:#DAD5C8;
  --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --sans:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--sumi);
  font-size:15px;
  line-height:1.6;
}
/* ---------- app frame ---------- */
#app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.appbar{
  background:var(--kon);color:#F3EFE4;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:baseline;gap:10px;
  position:sticky;top:0;z-index:20;
}
header.appbar h1{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.35em}
header.appbar .sub{font-size:11px;opacity:.75;letter-spacing:.1em}
header.appbar .rolemark{margin-left:auto;font-size:10.5px;border:1px solid rgba(243,239,228,.5);border-radius:999px;padding:2px 9px;letter-spacing:.08em}
main{flex:1;padding:14px 14px 90px}
/* bottom nav */
nav.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:var(--kon-deep);
  display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabbar .inner{display:flex;width:100%;max-width:640px}
nav.tabbar button{
  flex:1;background:none;border:none;color:#9FB0C6;
  font-family:var(--sans);font-size:11px;padding:9px 0 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
nav.tabbar button .ic{font-size:19px;line-height:1}
nav.tabbar button.active{color:#F3EFE4}
nav.tabbar button.active .ic{color:#E8C877}
nav.tabbar button.hidden{display:none}
/* ---------- common ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px}
h2.section{font-family:var(--serif);font-size:15px;color:var(--kon);letter-spacing:.15em;margin:16px 2px 8px;display:flex;align-items:center;gap:8px}
h2.section::after{content:"";flex:1;height:1px;background:var(--line)}
.muted{color:var(--nezu);font-size:12.5px}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid;letter-spacing:.05em;vertical-align:middle}
.badge.haka{color:var(--kon);border-color:var(--kon);background:#EDF1F7}
.badge.eitai{color:var(--matcha);border-color:var(--matcha);background:#EFF3EA}
.badge.none{color:var(--nezu);border-color:var(--line);background:#F2F0E9}
.badge.nenki{color:#fff;border-color:var(--shu);background:var(--shu);font-weight:600}
.badge.shinto{color:var(--shu);border-color:var(--shu);background:#F8ECEA}
.badge.t-dan{color:#fff;border-color:var(--kon);background:var(--kon)}
.badge.t-bochi{color:var(--matcha);border-color:var(--matcha);background:#EFF3EA}
.badge.t-tan{color:var(--shu);border-color:var(--shu);background:#F8ECEA}
button.btn{
  font-family:var(--sans);font-size:14px;border-radius:8px;cursor:pointer;
  padding:9px 16px;border:1px solid var(--kon);background:var(--kon);color:#F3EFE4;
}
button.btn.ghost{background:transparent;color:var(--kon)}
button.btn.danger{background:transparent;border-color:var(--shu);color:var(--shu)}
button.btn.small{font-size:12.5px;padding:5px 11px}
button.btn:active{opacity:.75}
input[type=text],input[type=tel],input[type=search],select,textarea{
  font-family:var(--sans);font-size:15px;width:100%;
  padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--sumi);
}
textarea{min-height:74px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--nezu);margin:10px 0 3px;letter-spacing:.05em}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.empty{text-align:center;color:var(--nezu);padding:38px 10px;font-size:13.5px}
.empty .big{font-family:var(--serif);font-size:17px;color:var(--sumi);margin-bottom:6px;letter-spacing:.1em}
/* ---------- list view ---------- */
.searchwrap{position:sticky;top:52px;z-index:15;background:var(--paper);padding:2px 0 10px}
.h-item{display:flex;align-items:center;gap:11px;cursor:pointer}
.h-item .name{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.06em}
.h-item .kana{font-size:11px;color:var(--nezu);letter-spacing:.1em}
.h-item .meta{margin-top:3px;font-size:12px;color:var(--nezu);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.h-item .arrow{margin-left:auto;color:var(--line);font-size:18px}
.countline{font-size:12px;color:var(--nezu);margin:2px 4px 8px;letter-spacing:.05em}
/* ---------- detail overlay ---------- */
#detail{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;display:none}
#detail.open{display:block}
#detail .dbar{
  background:var(--kon);color:#F3EFE4;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;
}
#detail .dbar .back{background:none;border:none;color:#F3EFE4;font-size:22px;cursor:pointer;padding:0 4px}
#detail .dbar .dname{font-family:var(--serif);font-size:18px;letter-spacing:.12em;font-weight:600}
#detail .dwrap{max-width:640px;margin:0 auto;padding:14px 14px 60px}
.kv{display:flex;font-size:14px;padding:3px 0}
.kv .k{width:82px;flex-shrink:0;color:var(--nezu);font-size:12.5px;padding-top:2px}
/* 位牌カード(戒名 縦書き) */
.ihai-scroller{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}
.ihai{
  flex-shrink:0;width:112px;min-height:196px;
  background:linear-gradient(#FFFDF6,#F7F2E4);
  border:1px solid #C9BFA6;border-top:4px solid var(--kon);
  border-radius:6px 6px 3px 3px;
  padding:12px 8px 9px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;
  box-shadow:0 1px 3px rgba(43,42,38,.08);
}
.ihai .kaimyo{
  writing-mode:vertical-rl;
  font-family:var(--serif);font-size:16.5px;font-weight:600;letter-spacing:.14em;
  min-height:120px;color:var(--sumi);
}
.ihai .zoku{font-size:11px;color:var(--nezu);margin-top:auto;padding-top:7px;text-align:center;line-height:1.45}
.ihai .nenkitag{margin-top:5px}
/* memos */
.memo{border-left:3px solid var(--matcha);padding:6px 10px;margin-bottom:8px;background:var(--card);border-radius:0 8px 8px 0}
.memo .mdate{font-size:11px;color:var(--nezu);letter-spacing:.05em}
.memo .mtext{font-size:14px;white-space:pre-wrap}
/* ---------- nenki view ---------- */
.yearctl{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 12px}
.yearctl .y{font-family:var(--serif);font-size:21px;letter-spacing:.1em}
.yearctl button{background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:34px;font-size:16px;color:var(--kon);cursor:pointer}
.nenki-item{display:flex;gap:12px;align-items:center;cursor:pointer}
.nenki-item .date{width:64px;flex-shrink:0;text-align:center;font-family:var(--serif);font-size:14px;color:var(--kon);line-height:1.35}
.nenki-item .info .knm{font-family:var(--serif);font-size:15.5px;font-weight:600}
.nenki-item .info .sub{font-size:12px;color:var(--nezu)}
.nenki-item .kai{margin-left:auto}
/* ---------- modal ---------- */
#modal-bg{position:fixed;inset:0;background:rgba(24,26,32,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
#modal-bg.open{display:flex}
#modal{
  background:var(--paper);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;
  border-radius:16px 16px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));
}
#modal h3{font-family:var(--serif);font-size:16px;color:var(--kon);letter-spacing:.15em;margin-bottom:6px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn{flex:1}
/* 自前の確認ダイアログ(ブラウザ標準confirmは環境によりブロックされるため) */
#confirm-bg{position:fixed;inset:0;background:rgba(24,26,32,.5);z-index:80;display:none;align-items:center;justify-content:center;padding:24px}
#confirm-bg.open{display:flex}
#confirm-box{background:var(--paper);border-radius:14px;max-width:420px;width:100%;padding:18px 16px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
/* ---------- 暗証番号ロック ---------- */
#lock{position:fixed;inset:0;background:var(--kon);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
#lock .box{width:100%;max-width:300px;text-align:center;color:#F3EFE4}
#lock h1{font-family:var(--serif);letter-spacing:.35em;font-size:22px;font-weight:600;margin-bottom:20px}
#lock input{width:100%;text-align:center;font-size:22px;letter-spacing:.3em;border-radius:10px;border:none;padding:12px;font-family:var(--sans)}
#lock .msg{color:#E8C877;font-size:13px;min-height:20px;margin-top:9px}
#lock button{margin-top:10px;width:100%;padding:11px;border-radius:10px;border:1px solid #F3EFE4;background:transparent;color:#F3EFE4;font-size:15px;cursor:pointer;font-family:var(--sans)}
.rolechoice{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;cursor:pointer;font-family:var(--sans)}
.rolechoice b{font-size:16px;color:var(--kon);font-family:var(--serif);letter-spacing:.1em}
.rolechoice .d{font-size:12.5px;color:var(--nezu);margin-top:3px}
/* ---------- import ---------- */
.map-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.map-row .colname{width:42%;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-row select{flex:1}
.preview-table{width:100%;font-size:11.5px;border-collapse:collapse;margin-top:8px}
.preview-table th,.preview-table td{border:1px solid var(--line);padding:3px 6px;text-align:left;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-table th{background:#EDEAE0;font-weight:600}
.notice{font-size:12.5px;background:#F3EFE0;border:1px solid #E0D8BE;border-radius:8px;padding:9px 11px;margin-bottom:10px;color:#6B6350}
.notice.warn{background:#F8ECEA;border-color:#E3C2BD;color:#8A3A31}
</style>
</head>
<body>
<div id="app">
  <header class="appbar">
    <h1>檀信徒帳</h1><span class="sub" id="temple-sub"></span>
    <span class="rolemark" id="rolemark"></span>
  </header>
  <main id="main"></main>
</div>

<div id="detail"></div>

<div id="modal-bg"><div id="modal"></div></div>

<div id="confirm-bg"><div id="confirm-box"></div></div>

<div id="lock"></div>

<nav class="tabbar"><div class="inner">
  <button data-tab="list"><span class="ic">帳</span>一覧</button>
  <button data-tab="nenki"><span class="ic">忌</span>年忌</button>
  <button data-tab="import" id="tab-import"><span class="ic">取</span>取込</button>
  <button data-tab="settings"><span class="ic">設</span>設定</button>
</div></nav>

<script>
/* =========================================================
   檀信徒帳 v2 — 端末役割対応・端末内保存版
   ・データは端末の中(localStorage)にのみ保存。外部送信は一切なし
   ・端末の役割: edit(更新用/Android・PC) / view(閲覧専用/iPhone)
   ・控えファイル(.json)の書き出し/読み込みで端末間のデータ渡し
========================================================= */
const KEY = 'danshinto-v1';
const ROLEKEY = 'danshinto-role';
const PINKEY = 'danshinto-pin';
let DB = { households: [], temple: '' };
let role = null;              // 'edit' | 'view' | null(未設定)
let pinHash = '';             // 暗証番号(復元不可能な形で保存)
let storageMode = 'memory';   // 'local' | 'claude' | 'memory'
let currentTab = 'list';
let currentId = null;
let nenkiYear = new Date().getFullYear();
let searchQ = '';
let importState = null;
let importType = 'jusho';  // 'jusho'住所録 | 'bochi'墓地管理表 | 'kako'過去帳

const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const canEdit = () => role === 'edit';
// 家名の表記ゆれ吸収（空白除去・末尾の「家」「様」除去・全角英数→半角）
function normName(s){
  return String(s||'').replace(/[\s　]/g,'')
    .replace(/(家|様|殿)$/,'')
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0));
}

/* ---------- 保存・読込(端末内優先) ---------- */
function detectStorage(){
  try{
    localStorage.setItem('__t','1'); localStorage.removeItem('__t');
    storageMode = 'local'; return;
  }catch(e){}
  if(typeof window.storage !== 'undefined' && window.storage) storageMode = 'claude';
}
async function load(){
  detectStorage();
  try{
    if(storageMode === 'local'){
      const v = localStorage.getItem(KEY); if(v) DB = JSON.parse(v);
      role = localStorage.getItem(ROLEKEY) || null;
      pinHash = localStorage.getItem(PINKEY) || '';
    }else if(storageMode === 'claude'){
      try{ const r = await window.storage.get(KEY); if(r && r.value) DB = JSON.parse(r.value); }catch(e){}
      try{ const r = await window.storage.get(ROLEKEY); if(r && r.value) role = r.value; }catch(e){}
      try{ const r = await window.storage.get(PINKEY); if(r && r.value) pinHash = r.value; }catch(e){}
    }
  }catch(e){ console.error(e); }
  if(!DB.households) DB.households = [];
  // 旧データからの引き継ぎ
  for(const h of DB.households){
    if(!h.type || h.type==='檀家' || h.type==='信徒') h.type = '檀信徒';
    if(h.phone && !h.phoneHome) h.phoneHome = h.phone;
    if(h.graveNote && !h.graveLocation) h.graveLocation = h.graveNote;
  }
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try{
      if(storageMode === 'local') localStorage.setItem(KEY, JSON.stringify(DB));
      else if(storageMode === 'claude') await window.storage.set(KEY, JSON.stringify(DB));
    }catch(e){ console.error('保存に失敗', e); appAlert('保存に失敗しました。空き容量をご確認ください。'); }
  }, 250);
}
async function saveRole(r){
  role = r;
  try{
    if(storageMode === 'local') localStorage.setItem(ROLEKEY, r);
    else if(storageMode === 'claude') await window.storage.set(ROLEKEY, r);
  }catch(e){}
}

/* ---------- 暗証番号ロック ---------- */
// 番号そのものは保存せず、復元できない形(ハッシュ)にして保存する
async function hashPin(s){
  try{
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('danshinto:'+s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h = 0; const t = 'danshinto:'+s;
    for(let i=0;i<t.length;i++){ h = (h*31 + t.charCodeAt(i)) >>> 0; }
    return 'x' + h.toString(16);
  }
}
async function storePin(v){
  pinHash = v;
  try{
    if(storageMode === 'local'){ v ? localStorage.setItem(PINKEY, v) : localStorage.removeItem(PINKEY); }
    else if(storageMode === 'claude'){ v ? await window.storage.set(PINKEY, v) : await window.storage.delete(PINKEY); }
  }catch(e){}
}
function showLock(){
  const l = $('#lock');
  l.innerHTML = `
    <div class="box">
      <h1>檀信徒帳</h1>
      <input type="password" inputmode="numeric" maxlength="6" id="lock-in" placeholder="暗証番号"
        onkeydown="if(event.key==='Enter')tryUnlock()">
      <div class="msg" id="lock-msg"></div>
      <button onclick="tryUnlock()">開く</button>
    </div>`;
  l.style.display = 'flex';
  setTimeout(()=>{ const i = $('#lock-in'); if(i) i.focus(); }, 150);
}
async function tryUnlock(){
  const v = $('#lock-in').value.trim();
  if(v && await hashPin(v) === pinHash){
    $('#lock').style.display = 'none';
    $('#lock').innerHTML = '';
  }else{
    $('#lock-msg').textContent = '暗証番号が違います';
    $('#lock-in').value = '';
    $('#lock-in').focus();
  }
}
async function savePinSetting(){
  const cur = $('#pin-cur') ? $('#pin-cur').value.trim() : '';
  const nw = $('#pin-new').value.trim();
  if(pinHash){
    if(!cur || (await hashPin(cur)) !== pinHash){ appAlert('現在の暗証番号が違います。'); return; }
  }
  if(nw){
    if(!/^\d{4,6}$/.test(nw)){ appAlert('暗証番号は4〜6桁の数字にしてください。'); return; }
    await storePin(await hashPin(nw));
    appAlert('暗証番号を設定しました。次にアプリを開くときから必要になります。\n※忘れると開けなくなります。控えファイルを定期的に書き出しておいてください。');
  }else{
    if(!pinHash){ appAlert('新しい暗証番号を入れてください。'); return; }
    await storePin('');
    appAlert('暗証番号を解除しました。');
  }
  render();
}

/* ---------- 和暦・日付 ---------- */
const ERAS = [
  {n:'令和', s:2019}, {n:'平成', s:1989}, {n:'昭和', s:1926}, {n:'大正', s:1912}, {n:'明治', s:1868}
];
function toWareki(y){
  for(const e of ERAS){ if(y >= e.s){ const n = y - e.s + 1; return e.n + (n===1?'元':n) + '年'; } }
  return '';
}
function parseDateStr(raw){
  if(!raw) return '';
  let s = String(raw).trim().replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  const eraMap = {'令和':2019,'平成':1989,'昭和':1926,'大正':1912,'明治':1868,'R':2019,'H':1989,'S':1926,'T':1912,'M':1868};
  let m = s.match(/^(令和|平成|昭和|大正|明治|[RHSTM])\s*(元|\d{1,2})[年.\/\-]?\s*(?:(\d{1,2})[月.\/\-]?\s*(?:(\d{1,2})日?)?)?/);
  if(m){
    const base = eraMap[m[1]];
    const y = base + (m[2]==='元' ? 1 : parseInt(m[2],10)) - 1;
    return fmtYMD(y, m[3], m[4]);
  }
  m = s.match(/^(\d{4})(?:[年.\/\-](\d{1,2}))?(?:[月.\/\-](\d{1,2}))?/);
  if(m) return fmtYMD(parseInt(m[1],10), m[2], m[3]);
  return '';
}
function fmtYMD(y,m,d){
  let out = String(y);
  if(m) out += '-' + String(parseInt(m,10)).padStart(2,'0');
  if(m && d) out += '-' + String(parseInt(d,10)).padStart(2,'0');
  return out;
}
function dispDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  let s = y + '年';
  if(m) s += m + '月';
  if(d) s += d + '日';
  const w = toWareki(y);
  return s + (w ? '（' + w.slice(0,-1) + '）' : '');
}

/* ---------- 年忌計算 ---------- */
const KAIKI = [3,7,13,17,23,27,33,37,43,47,50,100];
function nenkiOf(deathIso, year){
  if(!deathIso) return null;
  const dy = parseInt(deathIso.split('-')[0],10);
  const diff = year - dy;
  if(diff === 1) return '一周忌';
  if(KAIKI.includes(diff + 1)) return (diff + 1) + '回忌';
  return null;
}
function nextNenki(deathIso, fromYear){
  if(!deathIso) return null;
  const dy = parseInt(deathIso.split('-')[0],10);
  for(let y = fromYear; y <= dy + 100; y++){
    const n = nenkiOf(deathIso, y);
    if(n) return {year: y, label: n};
  }
  return null;
}

/* ---------- 表示ヘルパ ---------- */
function graveBadge(h){
  if(h.grave === 'haka')  return '<span class="badge haka">墓地</span>';
  if(h.grave === 'eitai') return '<span class="badge eitai">永代供養</span>';
  return '<span class="badge none">墓なし</span>';
}
function typeBadge(h){

function renderNenki(){
  const items = [];
  for(const h of DB.households){
    for(const d of (h.deceased||[])){
      const n = nenkiOf(d.deathDate, nenkiYear);
      if(n){
        const parts = (d.deathDate||'').split('-');
        items.push({h, d, label:n, m: parts[1]?parseInt(parts[1],10):13, day: parts[2]?parseInt(parts[2],10):0});
      }
    }
  }
  items.sort((a,b)=> a.m - b.m || a.day - b.day);
  let html = `
    <div class="yearctl">
      <button onclick="nenkiYear--;render()">‹</button>
      <div class="y">${nenkiYear}年<span class="muted" style="font-size:12px">（${toWareki(nenkiYear).slice(0,-1)}）</span></div>
      <button onclick="nenkiYear++;render()">›</button>
    </div>`;
  if(!items.length){
    html += `<div class="empty"><div class="big">${nenkiYear}年の年忌はありません</div>命日が登録された物故者から自動で計算されます</div>`;
  }else{
    html += `<div class="countline">${items.length}件（一周忌・${KAIKI.join('・')}回忌）</div>`;
    for(const it of items){
      html += `
      <div class="card nenki-item" onclick="openDetail('${it.h.id}')">
        <div class="date">${it.m<=12 ? it.m+'月'+(it.day?it.day+'日':'') : '月不明'}</div>
        <div class="info">
          <div class="knm">${esc(it.d.kaimyo || it.d.zokumyo)}</div>

        <div class="kai"><span class="badge nenki">${it.label}</span></div>
      </div>`;
    }
  }
  return html;
}

    3つのデータを一本化する手順：①住所録 → ②墓地管理表 → ③過去帳 の順に取り込むのがおすすめです。家名が一致するものは自動でひとつの家にまとまります。<br><br>

function guessField(h){
  h = String(h);
  if(/印刷|FAX|Fax|fax|登録・更新/.test(h)) return 'skip';
  if(/ふりがな|フリガナ|かな/.test(h)) return 'kana';
  if(/家名|氏名|名前|世帯|施主|檀家名|名義|使用者/.test(h)) return 'name';
  if(/区分|種別/.test(h)) return 'type';
  if(/〒|郵便/.test(h)) return 'address';
  if(/住所/.test(h)) return 'address';
  if(/携帯|ケータイ|ｹｰﾀｲ|Mobile|mobile/.test(h)) return 'phoneMobile';
  if(/電話|TEL|Tel/.test(h)) return 'phoneHome';
  if(/管理費/.test(h)) return 'graveFee';
  if(/墓地の場所|墓所|墓地番号|区画|霊園/.test(h)) return 'graveLocation';
  if(/墓|供養/.test(h)) return 'grave';
  if(/戒名|法名/.test(h)) return 'kaimyo';
  if(/俗名|故人/.test(h)) return 'zokumyo';
  if(/続柄/.test(h)) return 'relation';
  if(/命日|没年|死亡|逝去/.test(h)) return 'deathDate';
  if(/メモ|備考|記事/.test(h)) return 'memo';
  return 'skip';
}
function parseCSV(text){
  const rows = []; let row = [], cur = '', inQ = false;
  text = text.replace(/\r\n?/g,'\n');
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){ if(text[i+1] === '"'){ cur+='"'; i++; } else inQ = false; }
      else cur += c;
    }else{
      if(c === '"') inQ = true;
      else if(c === ',' ){ row.push(cur); cur=''; }
      else if(c === '\n'){ row.push(cur); if(row.some(x=>x.trim()!=='')) rows.push(row); row=[]; cur=''; }
      else cur += c;
    }
  }
  row.push(cur); if(row.some(x=>x.trim()!=='')) rows.push(row);
  return rows;
}
async function handleCSVFile(file){
  const buf = await file.arrayBuffer();
  let text;
  try{ text = new TextDecoder('utf-8',{fatal:true}).decode(buf); }
  catch(e){ text = new TextDecoder('shift-jis').decode(buf); }
  const all = parseCSV(text);
  if(all.length < 2){ appAlert('データ行が見つかりませんでした。1行目に見出し、2行目以降にデータがあるCSVを選んでください。'); return; }
  importState = { headers: all[0], rows: all.slice(1), srcType: importType };
  render();
}
function runImport(){
  const map = {};
  document.querySelectorAll('#main select[data-col]').forEach(s=>{ map[s.dataset.col] = s.value; });
  const ow = !!($('#ow') && $('#ow').checked);
  const {headers, rows, srcType} = importState;
  const byName = {};
  for(const h of DB.households) byName[normName(h.name)] = h;
  let newH = 0, newD = 0, merged = 0;
  const mergedNames = new Set();
  for(const r of rows){
    const getAll = f => { const out = []; for(const i in map){ if(map[i]===f && r[i]!=null && String(r[i]).trim()!=='') out.push(String(r[i]).trim()); } return out; };
    const get = f => (getAll(f)[0] || '');
    const name = get('name');
    if(!name) continue;
    const key = normName(name);
    // 住所に割り当てた列が複数あっても、全部つなげて取りこぼさない
    const addr = getAll('address').join('　');
    const phome = getAll('phoneHome').join('／');
    const pmobile = getAll('phoneMobile').join('／');
    const tRaw = get('type');
    const type = /単発/.test(tRaw) ? '単発' : (/墓地/.test(tRaw) ? '墓地のみ' : '檀信徒');
    const graveVal = get('grave') ? (/永代/.test(get('grave')) ? 'eitai' : (/墓|有|あり/.test(get('grave')) ? 'haka' : 'none')) : '';
    let h = byName[key];
    if(!h){
      h = { id: uid(), name,
            kana: get('kana'),
            // 墓地管理表から新規に入った家は「墓地のみ」、過去帳からは「檀信徒」
            type: srcType === 'bochi' ? '墓地のみ' : type,
            address: addr, phoneHome: phome, phoneMobile: pmobile,
            // 墓地管理表に載っている家は、指定がなければ「墓地あり」とみなす
            grave: graveVal || (srcType === 'bochi' ? 'haka' : 'none'),
            graveLocation: get('graveLocation'), graveFee: get('graveFee'),
            deceased: [], memos: [] };
      DB.households.push(h); byName[key] = h; newH++;
    }else{
      if(!mergedNames.has(key)){ mergedNames.add(key); merged++; }
      // 空欄は埋める。上書きモードならCSVに値がある項目を書き換える
      const setF = (k,v) => { if(v && (ow || !h[k])) h[k] = v; };
      setF('kana', get('kana'));
      setF('address', addr);
      setF('phoneHome', phome);
      setF('phoneMobile', pmobile);
      setF('graveLocation', get('graveLocation'));
      setF('graveFee', get('graveFee'));
      if(ow && tRaw) h.type = type;
      if(graveVal && (ow || h.grave === 'none')) h.grave = graveVal;
      else if(srcType === 'bochi' && h.grave === 'none') h.grave = 'haka';
    }
    const kaimyo = get('kaimyo'), zoku = get('zokumyo'), dd = parseDateStr(get('deathDate'));
    if(kaimyo || zoku){
      const dup = h.deceased.some(d => d.kaimyo === kaimyo && d.zokumyo === zoku && d.deathDate === dd);
      if(!dup){ h.deceased.push({id:uid(), kaimyo, zokumyo:zoku, relation:get('relation'), deathDate:dd}); newD++; }
    }
    const memo = get('memo');
    if(memo && !h.memos.some(m=>m.text===memo)){
      h.memos.push({id:uid(), date: new Date().toISOString().slice(0,10), text: memo});
    }
  }
  save();
  importState = null;
  currentTab = 'list';
  render();
  appAlert(`取り込みました。\n既存の家に統合: ${merged}件\n新しい家: ${newH}件\n物故者の追加: ${newD}名`);
}

      ${pinHash ? '<label class="f">現在の暗証番号</label><input type="password" inputmode="numeric" maxlength="6" id="pin-cur">' : ''}
      <label class="f">新しい暗証番号（4〜6桁の数字${pinHash?'。空欄のまま保存すると解除':''}）</label>
      <input type="password" inputmode="numeric" maxlength="6" id="pin-new">
      <div style="text-align:right;margin-top:8px"><button class="btn small" onclick="savePinSetting()">保存</button></div>
    </div>

    <h2 class="section">控えファイル（端末間のデータ渡し・バックアップ）</h2>
    <div class="card">
      <div class="muted" style="margin-bottom:10px">
        「書き出す」で全データが1つのファイル（.json）になります。USBケーブルやSDカードで他の端末に移し、その端末で「読み込む」を押してください。<b>メールやクラウドを経由するとクローズドでなくなるのでご注意を。</b>
      </div>
      <div class="modal-actions" style="margin-top:0">
        <button class="btn ghost" onclick="downloadBackup()">控えを書き出す</button>
        <button class="btn" onclick="$('#restorefile').click()">控えを読み込む</button>
      </div>
      <input type="file" id="restorefile" accept=".json,.txt" style="display:none">
    </div>

    ${canEdit() ? `
    <h2 class="section">表示</h2>
    <div class="card">
      <label class="f">寺名（画面上部に表示。空欄なら非表示）</label>
      <div class="row2">
        <input type="text" id="f-temple" value="${esc(DB.temple||'')}" placeholder="例：華山寺">
        <button class="btn small" style="flex:0 0 auto" onclick="DB.temple=$('#f-temple').value.trim();save();render()">保存</button>
      </div>
    </div>
    <h2 class="section">危険な操作</h2>
    <div class="card" style="text-align:center">
      <button class="btn danger" onclick="wipeAll()">全データを削除</button>
    </div>` : `
    <div class="notice">この端末は閲覧専用です。データの追加・変更・削除はできません（控えの読み込みによる差し替えのみ可能です）。</div>`}
    `;
}
function downloadBackup(){
  const d = new Date();
  const stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  const blob = new Blob([JSON.stringify(DB)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `danshinto_hikae_${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}
async function handleRestoreFile(file){
  try{
    const text = await file.text();
    const d = JSON.parse(text);
    if(!d.households) throw 0;
    if(await appConfirm(`この端末のデータを、控えファイル（${d.households.length}家）の内容で置き換えます。よろしいですか？`)){
      DB = d; save(); currentTab = 'list'; render();
      appAlert('読み込みました。');
    }
  }catch(e){ appAlert('読み込めませんでした。「控えを書き出す」で作ったファイルを選んでください。'); }
}
async function wipeAll(){
  if(await appConfirm('全データを削除します。元に戻せません。よろしいですか？') && await appConfirm('本当に削除しますか？')){
    DB = {households:[], temple: DB.temple||''}; save(); render();
  }
}

/* =========================================================
   フォーム(モーダル)
========================================================= */
function openModal(html, lock){
  $('#modal').innerHTML = html;
  $('#modal-bg').classList.add('open');
  $('#modal-bg').dataset.lock = lock ? '1' : '';
}
function closeModal(){ $('#modal-bg').classList.remove('open'); }
$('#modal-bg').addEventListener('click', e => {
  if(e.target.id === 'modal-bg' && !$('#modal-bg').dataset.lock) closeModal();
});

/* 自前の確認・お知らせダイアログ（ブラウザ標準のalert/confirmは環境によりブロックされるため使わない） */
function appDialog(msg, withCancel){
  return new Promise(res => {
    $('#confirm-box').innerHTML = `
      <div style="white-space:pre-wrap;font-size:14.5px;line-height:1.7">${esc(msg)}</div>
      <div class="modal-actions">
        ${withCancel ? '<button class="btn ghost" id="cf-no">やめる</button>' : ''}
        <button class="btn" id="cf-ok">OK</button>
      </div>`;
    $('#confirm-bg').classList.add('open');
    const done = v => { $('#confirm-bg').classList.remove('open'); res(v); };
    $('#cf-ok').onclick = () => done(true);
    const no = $('#cf-no'); if(no) no.onclick = () => done(false);
  });
}
const appAlert = m => appDialog(m, false);
const appConfirm = m => appDialog(m, true);

/* 端末役割の選択 */
function askRole(changing){
  openModal(`
    <h3>この端末の役割</h3>
    <div class="muted" style="margin-top:4px">${changing?'役割を変更します。':'はじめに、この端末をどう使うか選んでください。あとから設定タブで変更できます。'}</div>
    <button class="rolechoice" onclick="chooseRole('edit')">
      <b>更新用</b>
      <div class="d">データの追加・変更・削除、CSV取込ができます。<br>（Android・パソコン向け）</div>
    </button>
    <button class="rolechoice" onclick="chooseRole('view')">
      <b>閲覧専用</b>
      <div class="d">見る・検索するだけ。うっかり触っても書き換わりません。<br>（iPhone向け）</div>
    </button>
    ${changing?'<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">やめる</button></div>':''}
  `, !changing);
}
async function chooseRole(r){
  await saveRole(r);
  closeModal();
  currentTab = 'list';
  render();
}

function openHouseholdForm(id){
  if(!canEdit()) return;
  const h = id ? DB.households.find(x=>x.id===id) : null;
  openModal(`
    <h3>${h?'家の情報を編集':'新しい家を登録'}</h3>
    <label class="f">家名（例：山田家）</label><input type="text" id="f-name" value="${esc(h?.name||'')}">
    <label class="f">ふりがな</label><input type="text" id="f-kana" value="${esc(h?.kana||'')}">
    <div class="row2">
      <div><label class="f">区分</label>
        <select id="f-type">
          <option ${!h||h.type==='檀信徒'?'selected':''}>檀信徒</option>
          <option ${h?.type==='墓地のみ'?'selected':''}>墓地のみ</option>
          <option ${h?.type==='単発'?'selected':''}>単発</option>
        </select></div>
      <div><label class="f">お墓</label>
        <select id="f-grave">
          <option value="haka" ${h?.grave==='haka'?'selected':''}>墓地あり</option>
          <option value="eitai" ${h?.grave==='eitai'?'selected':''}>永代供養</option>
          <option value="none" ${!h||h.grave==='none'?'selected':''}>なし・不明</option>
        </select></div>
    </div>
    <label class="f">墓地の場所（霊園名・区画番号など）</label><input type="text" id="f-gloc" value="${esc(h?.graveLocation||'')}">
    <label class="f">墓地管理費（例：年5,000円・4月集金）</label><input type="text" id="f-gfee" value="${esc(h?.graveFee||'')}">
    <label class="f">住所</label><input type="text" id="f-addr" value="${esc(h?.address||'')}">
    <div class="row2">
      <div><label class="f">電話（自宅）</label><input type="tel" id="f-phome" value="${esc(h?.phoneHome||'')}"></div>
      <div><label class="f">携帯電話</label><input type="tel" id="f-pmobile" value="${esc(h?.phoneMobile||'')}"></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">やめる</button>
      <button class="btn" onclick="saveHousehold('${id||''}')">保存する</button>
    </div>`);
}
function saveHousehold(id){
  const name = $('#f-name').value.trim();
  if(!name){ appAlert('家名を入れてください'); return; }
  const data = {
    name, kana: $('#f-kana').value.trim(), type: $('#f-type').value,
    grave: $('#f-grave').value,
    graveLocation: $('#f-gloc').value.trim(), graveFee: $('#f-gfee').value.trim(),
    address: $('#f-addr').value.trim(),
    phoneHome: $('#f-phome').value.trim(), phoneMobile: $('#f-pmobile').value.trim()
  };
  if(id){
    Object.assign(DB.households.find(x=>x.id===id), data);
  }else{
    const h = {id: uid(), ...data, deceased:[], memos:[]};
    DB.households.push(h);
    currentId = h.id;
  }
  save(); closeModal();
  if(currentId) openDetail(currentId); else render();
  render();
}
async function delHousehold(id){
  if(!canEdit()) return;
  const h = DB.households.find(x=>x.id===id);
  if(await appConfirm(`「${h.name}」を削除します。物故者・メモも消えます。よろしいですか？`)){
    DB.households = DB.households.filter(x=>x.id!==id);
    save(); closeDetail();
  }
}

/* 家同士の手動統合（自動照合できなかった表記ゆれ・二重登録の解消用） */
function openMergeForm(id){
  if(!canEdit()) return;
  const others = DB.households.filter(x=>x.id!==id)
    .sort((a,b)=>(a.kana||a.name).localeCompare(b.kana||b.name,'ja'));
  if(!others.length){ appAlert('統合できる他の家がありません。'); return; }
  openModal(`
    <h3>別の家と統合</h3>
    <div class="muted" style="margin-top:4px">選んだ家の物故者・メモ・住所などをこの家に取り込み、選んだ家は削除します。同じ家が表記ゆれで二重に登録されたときに使ってください。</div>
    <label class="f">取り込む家を選ぶ</label>
    <select id="f-merge">${others.map(o=>`<option value="${o.id}">${esc(o.name)}${o.kana?'（'+esc(o.kana)+'）':''}　物故者${(o.deceased||[]).length}名</option>`).join('')}</select>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">やめる</button>
      <button class="btn" onclick="doMerge('${id}')">統合する</button>
    </div>`);
}
async function doMerge(keepId){
  const srcId = $('#f-merge').value;
  const keep = DB.households.find(x=>x.id===keepId);
  const src = DB.households.find(x=>x.id===srcId);
  if(!keep || !src) return;
  if(!(await appConfirm(`「${src.name}」の内容を「${keep.name}」に取り込み、「${src.name}」を削除します。よろしいですか？`))) return;
  for(const d of (src.deceased||[])){
    const dup = (keep.deceased||[]).some(x=>x.kaimyo===d.kaimyo && x.zokumyo===d.zokumyo && x.deathDate===d.deathDate);
    if(!dup) keep.deceased.push(d);
  }
  keep.memos = [...(keep.memos||[]), ...(src.memos||[])];
  for(const k of ['kana','address','phoneHome','phoneMobile','graveLocation','graveFee']){
    if(!keep[k] && src[k]) keep[k] = src[k];
  }
  if((keep.grave==='none'||!keep.grave) && src.grave && src.grave!=='none') keep.grave = src.grave;
  DB.households = DB.households.filter(x=>x.id!==srcId);
  save(); closeModal(); openDetail(keepId);
}

function openDeceasedForm(did){
  if(!canEdit()) return;
  const h = DB.households.find(x=>x.id===currentId);
  const d = did ? h.deceased.find(x=>x.id===did) : null;
  openModal(`
    <h3>${d?'物故者の編集':'物故者を追加'}</h3>
    <label class="f">戒名</label><input type="text" id="f-kaimyo" value="${esc(d?.kaimyo||'')}">
    <label class="f">俗名</label><input type="text" id="f-zoku" value="${esc(d?.zokumyo||'')}">
    <div class="row2">
      <div><label class="f">続柄（例：当主の父）</label><input type="text" id="f-rel" value="${esc(d?.relation||'')}"></div>
    </div>
    <label class="f">命日（令和6年3月2日／2024/3/2 どちらでも可）</label>
    <input type="text" id="f-dd" value="${esc(d?.deathDate?dispDate(d.deathDate).replace(/（.*/,''):'')}">
    <div class="modal-actions">
      ${d?`<button class="btn danger" onclick="delDeceased('${d.id}')">削除</button>`:''}
      <button class="btn ghost" onclick="closeModal()">やめる</button>
      <button class="btn" onclick="saveDeceased('${did||''}')">保存する</button>
    </div>`);
}
function saveDeceased(did){
  const h = DB.households.find(x=>x.id===currentId);
  const kaimyo = $('#f-kaimyo').value.trim(), zoku = $('#f-zoku').value.trim();
  if(!kaimyo && !zoku){ appAlert('戒名か俗名のどちらかは入れてください'); return; }
  const ddRaw = $('#f-dd').value.trim();
  const dd = parseDateStr(ddRaw);
  if(ddRaw && !dd){ appAlert('命日の形式が読み取れませんでした。「令和6年3月2日」や「2024/3/2」の形で入れてください。'); return; }
  const data = {kaimyo, zokumyo: zoku, relation: $('#f-rel').value.trim(), deathDate: dd};
  if(did) Object.assign(h.deceased.find(x=>x.id===did), data);
  else h.deceased.push({id: uid(), ...data});
  save(); closeModal(); openDetail(h.id);
}
async function delDeceased(did){
  const h = DB.households.find(x=>x.id===currentId);
  if(await appConfirm('この物故者を削除しますか？')){
    h.deceased = h.deceased.filter(x=>x.id!==did);
    save(); closeModal(); openDetail(h.id);
  }
}

function addMemo(){
  if(!canEdit()) return;
  const t = $('#new-memo').value.trim();
  if(!t) return;
  const h = DB.households.find(x=>x.id===currentId);
  h.memos.push({id: uid(), date: new Date().toISOString().slice(0,10), text: t});
  save(); openDetail(h.id);
}
async function delMemo(mid){
  if(!canEdit()) return;
  const h = DB.households.find(x=>x.id===currentId);
  if(await appConfirm('このメモを削除しますか？')){
    h.memos = h.memos.filter(m=>m.id!==mid);
    save(); openDetail(h.id);
  }
}

/* =========================================================
   イベント
========================================================= */
document.querySelectorAll('nav.tabbar button').forEach(b=>{
  b.addEventListener('click', ()=>{ currentTab = b.dataset.tab; importState = null; render(); });
});
function afterRender(){
  const s = $('#search');
  if(s){
    s.addEventListener('input', e=>{
      searchQ = e.target.value;
      const pos = s.selectionStart;
      const main = $('#main'); main.innerHTML = renderList();
      const s2 = $('#search'); s2.focus(); s2.setSelectionRange(pos,pos);
      afterRender();
    }, {once:true});
  }
  const f = $('#csvfile');
  if(f) f.addEventListener('change', e=>{ if(e.target.files[0]) handleCSVFile(e.target.files[0]); });
  const it = $('#imp-type');
  if(it) it.addEventListener('change', e=>{ importType = e.target.value; });
  const rf = $('#restorefile');
  if(rf) rf.addEventListener('change', e=>{ if(e.target.files[0]) handleRestoreFile(e.target.files[0]); e.target.value=''; });
}

/* 起動 */
(async ()=>{
  await load();
  render();
  if(!role) askRole(false);
  if(pinHash) showLock();
})();
</script>
